name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: 安装 NDK 与 CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 接入参数由 Repository Secrets 注入。
      # 全部缺失时也能构建成功 —— App 启动后会提示「未配置」，不会崩溃。
      - name: 构建 debug 与 release
        env:
          BASE_URL: ${{ secrets.RAINAUTH_BASE_URL }}
          APP_KEY: ${{ secrets.RAINAUTH_APP_KEY }}
          APP_SECRET: ${{ secrets.RAINAUTH_APP_SECRET }}
          X25519_PUB: ${{ secrets.RAINAUTH_X25519_PUB }}
          ED25519_PUB: ${{ secrets.RAINAUTH_ED25519_PUB }}
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease \
            -PRAINAUTH_BASE_URL="$BASE_URL" \
            -PRAINAUTH_APP_KEY="$APP_KEY" \
            -PRAINAUTH_APP_SECRET="$APP_SECRET" \
            -PRAINAUTH_X25519_PUB="$X25519_PUB" \
            -PRAINAUTH_ED25519_PUB="$ED25519_PUB"

      - name: 汇总产物信息
        run: |
          echo "### APK 产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            SIZE=$(du -h "$f" | cut -f1)
            SHA=$(sha256sum "$f" | cut -c1-16)
            echo "- \`$f\`  $SIZE  sha256:$SHA…" >> $GITHUB_STEP_SUMMARY
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: rainauth-demo-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
